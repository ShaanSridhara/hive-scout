<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D98E04">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hive Scout">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<title>Hive Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app, sticky top bar, three views (event → matches → score) plus a team summary view */
:root{
  --bg:#FBF8F1; --surface:#FFFFFF; --sunk:#F2ECDD; --fg:#211C12; --muted:#6E6550; --line:#E3DAC4; --mat:#E4DED0; --seam:#CFC6B2; --wall:#8C826C;
  --honey:#D98E04; --honey-ink:#2A1C00; --honey-soft:#FCEBC4;
  --red:#D23A2E; --red-soft:#FBE1DE; --blue:#2C62D6; --blue-soft:#DEE7FB; --ok:#2F8A4C;
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15120C; --surface:#1F1B13; --sunk:#2A251A; --fg:#F3EDDF; --muted:#A99F88; --line:#3A3326; --mat:#2B271F; --seam:#3F382B; --wall:#6E6550;
  --honey:#F2B33D; --honey-ink:#1E1400; --honey-soft:#3B2D10;
  --red:#F06A5E; --red-soft:#3D1A17; --blue:#6E97F2; --blue-soft:#18243F; --ok:#5BC07A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15120C; --surface:#1F1B13; --sunk:#2A251A; --fg:#F3EDDF; --muted:#A99F88; --line:#3A3326; --mat:#2B271F; --seam:#3F382B; --wall:#6E6550;
  --honey:#F2B33D; --honey-ink:#1E1400; --honey-soft:#3B2D10;
  --red:#F06A5E; --red-soft:#3D1A17; --blue:#6E97F2; --blue-soft:#18243F; --ok:#5BC07A; color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{width:30px;height:30px;flex:none}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em}
.evt{margin-left:auto;min-width:0;text-align:right}
.evt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evt span{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.linkbtn{background:none;border:0;padding:0;color:var(--honey);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}

main{padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:24px}
h2{font-size:17px}
.sub{color:var(--muted);margin:0}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.field{display:flex;gap:8px}
input[type=text],input[type=number],input[type=search]{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:var(--honey);color:var(--honey-ink)}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block}
.row .main small{color:var(--muted)}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--honey-soft);color:var(--fg);white-space:nowrap}

.tabs{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:11px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input{font-size:15px;padding:9px 12px}
.status{font-size:12px;color:var(--muted)}

/* match card */
.match{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:58px 1fr;gap:4px 10px;align-items:center}
.match.next{border-color:var(--honey);box-shadow:0 0 0 2px var(--honey-soft)}
.mnum{grid-row:span 2;font-family:var(--f-mono);font-weight:700;font-size:18px;display:flex;flex-direction:column;line-height:1.1}
.mnum small{font-family:var(--f-body);font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.mnum small.nx{color:var(--honey)}
.alli{display:flex;gap:6px}
.tm{flex:1;min-width:0;border:0;border-radius:8px;padding:8px 4px;font-family:var(--f-mono);font-weight:700;font-size:15px;position:relative}
.tm.r{background:var(--red-soft);color:var(--red)}
.tm.b{background:var(--blue-soft);color:var(--blue)}
.tm.mine{outline:2px solid var(--honey);outline-offset:-2px}
.tm.done::after{content:"✓";position:absolute;top:2px;right:5px;font-size:11px;color:var(--ok)}
.tm.done{opacity:.6}

/* scoring */
.scorehead{display:flex;align-items:center;gap:12px}
.scorehead .tag{font-family:var(--f-mono);font-weight:700;font-size:28px;padding:4px 12px;border-radius:10px}
.tag.r{background:var(--red-soft);color:var(--red)}
.tag.b{background:var(--blue-soft);color:var(--blue)}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.counter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.counter .n{font-family:var(--f-mono);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.counter .pm{display:flex;gap:8px;width:100%}
.counter .pm button{flex:1;border:0;border-radius:10px;padding:14px 0;font-size:22px;font-weight:800}
.pm .minus{background:var(--sunk)}
.pm .plus{background:var(--honey);color:var(--honey-ink)}

.fieldwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.fieldframe{display:grid;grid-template-columns:22px 1fr 22px;grid-template-rows:auto 1fr auto;gap:4px;align-items:stretch}
.side{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;color:var(--muted)}
.side.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.side.v.right{transform:none}
.side.red,.side.blue{display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:9px}
.side.red{color:var(--red);background:var(--red-soft)} .side.blue{color:var(--blue);background:var(--blue-soft)}
.side.red{margin-block:16% 8%} .side.blue{margin-block:16% 8%}
.grid{position:relative;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);aspect-ratio:1;max-width:100%;background:var(--mat);border:4px solid var(--wall);border-radius:6px}
.tile{border:0;border-right:1px dashed var(--seam);border-bottom:1px dashed var(--seam);background:transparent;font-family:var(--f-mono);font-size:10px;color:var(--muted);padding:3px 0 0 4px;position:relative;text-align:left;vertical-align:top;display:flex;align-items:flex-start;justify-content:flex-start;min-width:0}
.tile:nth-child(6n+1){border-right:1px dashed var(--seam)}
.tile[aria-pressed=true]{background:color-mix(in srgb,var(--honey) 72%,transparent);color:var(--honey-ink);font-weight:700}
.tile .lbl{position:relative;z-index:2}
.fieldsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.checks{display:grid;grid-template-columns:1fr;gap:8px}
.check{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600}
.check .box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;color:transparent}
.check small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.check[aria-pressed=true]{border-color:var(--red);background:var(--red-soft)}
.check[aria-pressed=true] .box{background:var(--red);border-color:var(--red);color:#fff}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.flag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.flag.bad{background:var(--red-soft);color:var(--red)}

.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.savebar .wrap{display:flex;gap:10px;padding-block:12px}
.savebar .btn{flex:1;font-size:17px;padding:15px}
.savebar .btn.ghost{flex:0 0 auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
.empty{text-align:center;color:var(--muted);padding:24px 8px}

/* team summary */
.team{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr 112px;gap:12px;align-items:center}
.team .num{font-family:var(--f-mono);font-weight:700;font-size:20px}
.stats{display:flex;gap:14px;margin-top:4px}
.stat b{font-family:var(--f-mono);font-size:18px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;aspect-ratio:1;background:var(--line);padding:2px;border-radius:5px}
.mini i{background:var(--sunk);border-radius:2px;position:relative;overflow:hidden}
.mini i b{position:absolute;inset:0;background:var(--honey)}
.tnote{font-size:12px;color:var(--muted);font-style:italic;margin-top:6px}

/* live scoring */
kbd{font-family:var(--f-mono);font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);border-bottom-width:2px;color:var(--fg);white-space:nowrap;line-height:1.3}
.clock{border-radius:14px;padding:14px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.clk-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.phase{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.time{font-family:var(--f-mono);font-weight:700;font-size:46px;line-height:1;font-variant-numeric:tabular-nums;color:var(--fg)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:currentColor}
.clk-sub{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph-auto{border-color:var(--honey);color:var(--honey)}
.ph-tele{border-color:var(--ok);color:var(--ok)}
.ph-eg{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.ph-trans{border-style:dashed}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tally div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tally b{display:block;font-family:var(--f-mono);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tally span{font-size:11px;color:var(--muted);font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;min-height:58px}
.act small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.act.main{grid-column:span 2;background:var(--honey);border-color:var(--honey);color:var(--honey-ink);font-size:20px;min-height:76px}
.act.main small{color:var(--honey-ink);opacity:.75}
.act.main kbd{background:rgb(0 0 0 / .12);border-color:rgb(0 0 0 / .15);color:var(--honey-ink)}
.act.on{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.act[aria-disabled=true]{opacity:.5}
.act.hit{background:var(--honey-soft);border-color:var(--honey)}
.act.main.hit{filter:brightness(1.12)}
/* made / miss shot pad */
.shotpad{display:grid;grid-template-columns:1.9fr 1fr;gap:10px}
.shot{position:relative;overflow:visible;display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;padding:14px 16px 12px;border-radius:18px;border:0;min-height:148px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.shot-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.shot-name{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.shot-n{font-family:var(--f-mono);font-weight:700;font-size:64px;line-height:1;margin-top:auto;font-variant-numeric:tabular-nums}
.shot-sub{font-size:12px;font-weight:600;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot.made{background:linear-gradient(160deg,#3DB065,#23804A);color:#fff;box-shadow:0 4px 0 #17603A,0 10px 24px rgb(35 128 74 / .35)}
.shot.made kbd{background:rgb(255 255 255 / .2);border-color:rgb(255 255 255 / .3);color:#fff}
.shot.miss{background:var(--surface);color:var(--red);border:2px solid var(--red);box-shadow:0 4px 0 var(--red-soft)}
.shot.miss .shot-sub{color:var(--muted);opacity:1}
.shot.hive{grid-column:span 2;min-height:0;padding:12px 16px;background:linear-gradient(160deg,#F2B33D,#D98E04);color:var(--honey-ink);box-shadow:0 4px 0 #9E6703,0 10px 24px rgb(217 142 4 / .3)}
.shot.hive kbd{background:rgb(0 0 0 / .12);border-color:rgb(0 0 0 / .15);color:var(--honey-ink)}
.shot.hive:active{box-shadow:0 1px 0 #9E6703}
.hive-row{display:flex;align-items:baseline;gap:12px}
.shot.hive .shot-n{font-size:44px;margin-top:0}
.hive .float{color:var(--honey-ink);top:14px}
.shot[aria-disabled=true]{filter:saturate(.35);opacity:.6}
.shot:active{transform:translateY(3px);box-shadow:0 1px 0 #17603A}
.shot.miss:active{box-shadow:0 1px 0 var(--red-soft)}
.float{position:absolute;right:22px;top:46px;font-family:var(--f-display);font-weight:800;font-size:34px;pointer-events:none;opacity:0}
.made .float{color:#fff;text-shadow:0 2px 8px rgb(0 0 0 / .3)}
@media (prefers-reduced-motion:no-preference){
  .shot{transition:transform .07s,box-shadow .07s}
  .shot.pop{animation:pop .22s ease-out}
  .shot.shake{animation:shake .25s ease-in-out}
  .float{animation:floatup .6s ease-out forwards}
  @keyframes pop{0%{transform:scale(.94)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @keyframes floatup{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-44px) scale(1.15)}}
}
.tile.cur{outline:3px solid var(--fg);outline-offset:-3px;z-index:3}
.log{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.log li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log .lt{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:34px}
.log .lp{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--honey-soft)}
.log .lp.tele{background:color-mix(in srgb,var(--ok) 20%,transparent)}
.log .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:16px;padding:0 4px}
.keys{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.keys span{display:inline-flex;gap:5px;align-items:center}
.btn.go{background:var(--ok);color:var(--bg);font-size:20px;letter-spacing:.04em}
.btn.go kbd{background:rgb(0 0 0 / .15);border-color:transparent;color:inherit}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0;font-weight:600}
.seg button[aria-pressed=true]{background:var(--honey);border-color:var(--honey);color:var(--honey-ink)}
.q{display:flex;flex-direction:column;gap:6px}
.q .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.sumcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr 104px;gap:12px;align-items:center}
.sumcard .stats{flex-wrap:wrap;margin:0}
textarea.notes{width:100%;min-height:90px;font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);resize:vertical}
details.mlog summary{cursor:pointer;font-weight:600;padding:4px 0}
.demo-pill{font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:99px;background:var(--honey);color:var(--honey-ink);margin-left:6px;vertical-align:2px}
@media (prefers-reduced-motion:no-preference){.act{transition:transform .08s,background .12s}.act.hit,.act:active{transform:scale(.96)}.ph-eg{animation:pulse 1s ease-in-out infinite alternate}@keyframes pulse{to{box-shadow:0 0 0 4px var(--red-soft)}}}
@media (prefers-reduced-motion:no-preference){.tile,.tm,.btn{transition:transform .08s}.tile:active,.tm:active,.btn:active,.pm button:active{transform:scale(.95)}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l12 7v14l-12 7-12-7V9z" fill="var(--honey)"/><path d="M16 9l6 3.5v7L16 23l-6-3.5v-7z" fill="var(--honey-ink)" opacity=".85"/></svg>
  <div class="brand">Hive Scout</div>
  <div class="evt" id="evtBox" hidden><b id="evtName"></b><span id="evtCode"></span> · <button class="linkbtn" id="changeEvt">Change</button></div>
</div></header>

<main class="wrap" id="app"></main>
<div class="savebar" id="savebar" hidden><div class="wrap"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const SEASON = 2026;
const API = "https://api.ftcscout.org/rest/v1";
const COLS = ["A","B","C","D","E","F"];
// Official BioBuzz tile names (manual Fig. 9-5): columns A-F left to right, rows 1-6 from the audience wall.
const tileAt = (r, c) => COLS[c] + (6 - r); // r = 0 is the far wall
const CHECKS = [
  {k:"jammed", label:"Nectar jammed in intake", hint:"A NECTAR got stuck in their intake"},
  {k:"pushed", label:"Easily pushed around", hint:"Lost position when defended or bumped"},
  {k:"dc", label:"Disconnected (DC)", hint:"Robot stopped or lost connection during the match"}
];

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>t.hidden=true, 2200); }

/* ---------- event picking ---------- */
async function findEventsForTeam(team){
  S.eventMsg = "Looking up team " + team + "…"; S.eventResults = null; render();
  try{
    const parts = await getJSON(`${API}/teams/${team}/events/${SEASON}`);
    const evs = await Promise.all(parts.map(p => getJSON(`${API}/events/${SEASON}/${p.eventCode}`).catch(()=>null)));
    S.eventResults = sortEvents(evs.filter(Boolean));
    S.eventMsg = S.eventResults.length ? "" : `Team ${team} isn't registered for any BioBuzz events yet.`;
  }catch(e){ S.eventMsg = "Couldn't find that team. Check the number and your connection."; S.eventResults = []; }

}
async function searchEvents(q){

async function loadTodaysEvents(){

function sortEvents(list){
  const t = today();
  const rank = e => (e.start <= t && e.end >= t) ? 0 : (e.start > t ? 1 : 2);
  return list.sort((a,b) => rank(a)-rank(b) || (rank(a)===2 ? b.start.localeCompare(a.start) : a.start.localeCompare(b.start)));
}
function pickEvent(e){

/* ---------- matches ---------- */
async function loadMatches(){

  if (S.event.demo){ S.matches = ls.get("hs.matches.DEMO", S.matches); S.matchStatus = "Demo schedule with made-up teams. Tap Change to pick a real event."; if (S.view==="matches") render(); return; }
  S.matchStatus = "Updating schedule…"; if (S.view==="matches") renderStatus();
  try{

  }catch(e){

/* ---------- storage: this device, merged across scouts by copy/paste ---------- */
function subscribeEntries(){
  S.entries = {};
  const local = ls.get("hs.entries", {});
  for (const [k,v] of Object.entries(local)) if (S.event && v.event === S.event.code) S.entries[k] = v;
}
async function saveEntry(entry){
  const local = ls.get("hs.entries", {}); local[entry.id] = entry; ls.set("hs.entries", local);
  S.entries[entry.id] = entry;
  return "device";
}
const CSV_HEAD = ["event","level","match_id","match","team","alliance","auto_tips","teleop_tips","tiles","nectar_jammed","pushed_around","disconnected","saved_at","misses","driving","speed","defense","pick","notes","events","auto_made","teleop_made"];
const clean = s => String(s ?? "").replace(/[,\r\n|]+/g, " ").trim();
const encEvents = evs => (evs||[]).map(e => [e.k, e.ph, e.t, e.tile||""].join(":")).join("|");
const decEvents = s => (s||"").split("|").filter(Boolean).map(x => { const [k,ph,t,tile] = x.split(":"); const e = {k, ph, t:+t||0}; if (/^[A-F][1-6]$/.test(tile||"")) e.tile = tile; return e; }).filter(e => EV_LABEL[e.k]);
function toCSV(list){
  const rows = [CSV_HEAD];
  list.sort((a,b)=>a.matchId-b.matchId || a.team-b.team).forEach(x => rows.push([x.event,x.level,x.matchId,x.match,x.team,x.alliance,x.autoTips,x.teleTips,(x.tiles||[]).join(" "),x.jammed?1:0,x.pushed?1:0,x.dc?1:0,x.savedAt||"",
    x.misses||0, x.driving||"", x.speed||"", x.defense||"", x.pick||"", clean(x.notes), encEvents(x.events), x.autoMade||0, x.teleMade||0]));
  return rows.map(r=>r.join(",")).join("\n");
}
function importCSV(text){
  const lines = text.trim().split(/\r?\n/).map(l => l.split(",").map(c => c.trim()));
  const hi = lines.findIndex(l => l[0] === "event" && l.includes("auto_tips"));
  if (hi < 0) return {added:0, updated:0, error:"That doesn't look like Hive Scout data. Paste what another scout copied with Copy data."};
  const h = lines[hi], col = n => h.indexOf(n);
  const local = ls.get("hs.entries", {}); let added = 0, updated = 0;
  for (const l of lines.slice(hi+1)){
    if (l.length < h.length) continue;
    const e = {event:l[col("event")], season:SEASON, level:l[col("level")], matchId:+l[col("match_id")], match:l[col("match")],
      team:+l[col("team")], alliance:l[col("alliance")], autoTips:+l[col("auto_tips")]||0, teleTips:+l[col("teleop_tips")]||0,
      tiles:(l[col("tiles")]||"").split(" ").filter(t => /^[A-F][1-6]$/.test(t)), savedAt:l[col("saved_at")]||"",
      jammed: l[col("nectar_jammed")]==="1", pushed: l[col("pushed_around")]==="1", dc: l[col("disconnected")]==="1",
      misses:+l[col("misses")]||0, driving:+l[col("driving")]||0, speed:l[col("speed")]||"", defense:l[col("defense")]||"", pick:l[col("pick")]||"", notes:l[col("notes")]||"", autoMade:+l[col("auto_made")]||0, teleMade:+l[col("teleop_made")]||0};
    if (!e.event || !e.team || !e.matchId) continue;
    const evs = decEvents(l[col("events")]);
    if (evs.length){
      e.events = evs;
      const a = evs.filter(x=>x.k==="tip"&&x.ph==="auto").length, t = evs.filter(x=>x.k==="tip"&&x.ph==="tele").length;
      const sa = evs.filter(x=>x.k==="shot"&&x.ph==="auto").length, st = evs.filter(x=>x.k==="shot"&&x.ph==="tele").length;
      if (e.autoTips > a || e.teleTips > t || e.autoMade > sa || e.teleMade > st) e.base = {auto:Math.max(0,e.autoTips-a), tele:Math.max(0,e.teleTips-t), madeAuto:Math.max(0,e.autoMade-sa), madeTele:Math.max(0,e.teleMade-st)};
    }
    e.id = `${e.event}_${e.level}-${e.matchId}_${e.team}`;
    const old = local[e.id];
    if (!old){ local[e.id] = e; added++; }
    else if ((e.savedAt||"") > (old.savedAt||"")){ local[e.id] = e; updated++; }
  }
  ls.set("hs.entries", local); subscribeEntries();
  return {added, updated};
}

/* ---------- scoring ---------- */
function openScore(m, t, mi){
  const id = entryId(S.event.code, m, t.teamNumber);
  const prev = S.entries[id];
  S.cur = {
    id, event:S.event.code, season:SEASON, level:m.tournamentLevel, matchId:m.id, match:matchLabel(m), mi,
    team:t.teamNumber, alliance:t.alliance, edited: !!prev,
    events: (prev?.events || []).map(e => ({...e})),
    // entries scored before live scoring (or merged from counts) keep their totals as a base
    base: prev ? (prev.base || (Array.isArray(prev.events) ? null : {auto:prev.autoTips||0, tele:prev.teleTips||0, madeAuto:prev.autoMade||0, madeTele:prev.teleMade||0})) : null,
    tiles: [...(prev?.tiles || [])],
    jammed: !!prev?.jammed, pushed: !!prev?.pushed, dc: !!prev?.dc,
    driving: prev?.driving || 0, speed: prev?.speed || "", defense: prev?.defense || "", pick: prev?.pick || "", notes: prev?.notes || "",
    stage: prev ? "survey" : "live", phase: "pre", dcOn: false, speedX: 1
  };
  S.view = "score"; render(); window.scrollTo(0,0);
}

/* ---------- live match clock ---------- */
let clockTimer = null;
const fmtClock = (s, up) => { s = up ? Math.floor(s) : Math.ceil(s); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
function elapsed(){ const c = S.cur; return (performance.now() - c.phaseStart) / 1000 * c.speedX; }
function matchTime(){ const c = S.cur, e = elapsed(); return c.phase==="auto" ? e : c.phase==="trans" ? DUR.auto + e : c.phase==="tele" ? DUR.auto + DUR.trans + e : 0; }
function startMatch(){
  const c = S.cur; if (!c || c.phase !== "pre") return;
  setPhase("auto"); clearInterval(clockTimer); clockTimer = setInterval(tick, 100);
}
function setPhase(p){ const c = S.cur; c.phase = p; c.phaseStart = performance.now(); c.eg = false; render(); }
function stopClock(){ clearInterval(clockTimer); clockTimer = null; }
function tick(){
  const c = S.cur;
  if (!c || S.view !== "score" || c.stage !== "live" || !DUR[c.phase]){ stopClock(); return; }
  const e = elapsed(), rem = Math.max(0, DUR[c.phase] - e);
  if (rem <= 0){ if (c.phase === "auto") setPhase("trans"); else if (c.phase === "trans") setPhase("tele"); else endMatch(); return; }
  if (c.phase === "tele" && rem <= ENDGAME && !c.eg){ c.eg = true; render(); return; }
  const t = document.getElementById("clockT"), b = document.getElementById("clockBar");
  if (t) t.textContent = fmtClock(rem);
  if (b) b.style.width = (100 * rem / DUR[c.phase]).toFixed(1) + "%";
}
function endMatch(){
  stopClock();
  const c = S.cur, T = tally(c);
  c.phase = "post"; c.stage = "survey";
  if (T.jam) c.jammed = true; if (T.push) c.pushed = true; if (T.dc) c.dc = true;
  render(); window.scrollTo(0,0); toast("Match over. Quick survey, then save.");
}
function tally(c){
  const ev = c.events || [], b = c.base || {auto:0, tele:0, tiles:[]};
  const n = (k, ph) => ev.filter(e => e.k === k && (!ph || e.ph === ph)).length;
  return {auto:b.auto + n("tip","auto"), tele:b.tele + n("tip","tele"),
    madeAuto:(b.madeAuto||0) + n("shot","auto"), madeTele:(b.madeTele||0) + n("shot","tele"),
    miss:n("miss"), jam:n("jam"), push:n("push"), dc:n("dc")};
}
function act(k){
  const c = S.cur; if (!c || c.stage !== "live") return;
  if (c.phase === "pre"){ toast("Press GO (Enter) when the match starts"); return; }
  if (k === "undo"){
    const ev = c.events.pop();
    if (!ev){ toast("Nothing to undo"); return; }
    if (ev.k === "dc") c.dcOn = false; if (ev.k === "rc") c.dcOn = true;
    render(); flash("undo"); toast("Undid " + EV_LABEL[ev.k].toLowerCase()); return;
  }
  let kind = k;
  if (k === "dc"){ kind = c.dcOn ? "rc" : "dc"; c.dcOn = !c.dcOn; }
  const ev = {k:kind, ph: c.phase === "tele" ? "tele" : "auto", t: +matchTime().toFixed(1)};
  c.events.push(ev); render(); flash(k);
}
function flash(k){
  const b = document.querySelector(`[data-act="${k}"]`); if (!b) return;
  if (k === "shot" || k === "tip" || k === "miss"){
    const good = k !== "miss";
    b.classList.add(good ? "pop" : "shake");
    const f = document.createElement("span"); f.className = "float"; f.textContent = good ? "+1" : "✕"; b.appendChild(f);
    try{ navigator.vibrate?.(good ? 18 : [10,40,10]); }catch(_){}
    return;
  }
  b.classList.add("hit"); setTimeout(() => b.classList.remove("hit"), 160);
}
function armed(key, msg){
  if (S._arm === key && Date.now() - S._armT < 3000){ S._arm = null; return true; }
  S._arm = key; S._armT = Date.now(); toast(msg); return false;
}
function leaveScore(){ stopClock(); S.view = "matches"; S.cur = null; render(); scrollToNext(); }
async function saveCur(){
  const c = S.cur, T = tally(c);
  const entry = {id:c.id, event:c.event, season:c.season, level:c.level, matchId:c.matchId, match:c.match, team:c.team, alliance:c.alliance,
    autoTips:T.auto, teleTips:T.tele, autoMade:T.madeAuto, teleMade:T.madeTele, misses:T.miss, tiles:[...c.tiles].sort(), events:c.events, jammed:c.jammed, pushed:c.pushed, dc:c.dc,
    driving:c.driving, speed:c.speed, defense:c.defense, pick:c.pick, notes:c.notes.trim(), savedAt:new Date().toISOString()};
  if (c.base) entry.base = c.base;
  await saveEntry(entry);
  if (S.event.demo && S.matches[c.mi]){ S.matches[c.mi].hasBeenPlayed = true; ls.set("hs.matches.DEMO", S.matches); }
  S.tab = "matches"; leaveScore();
  toast(`Saved ${c.team} in ${c.match}`);
}

/* ---------- render ---------- */
function render(){

function viewEvent(){

  window._evcache = [...(S.eventResults||[]), ...(S.todays||[])];

function viewTabs(){

}

function viewMatches(){
  const nextIdx = S.matches.findIndex(m => !m.hasBeenPlayed);
  let list = S.matches.map((m,i)=>({m,i}));
  const f = S.filter.trim();
  if (f) list = list.filter(({m}) => (m.teams||[]).some(t => String(t.teamNumber).includes(f)));
  if (S.onlyMine && S.myTeam) list = list.filter(({m}) => (m.teams||[]).some(t => String(t.teamNumber) === String(S.myTeam)));
  const card = ({m,i}) => {
    const red = (m.teams||[]).filter(t=>t.alliance==="Red"), blue = (m.teams||[]).filter(t=>t.alliance==="Blue");
    const chip = t => {
      const done = !!S.entries[entryId(S.event.code, m, t.teamNumber)];
      const mine = String(t.teamNumber) === String(S.myTeam);
      return `<button class="tm ${t.alliance==="Red"?"r":"b"} ${done?"done":""} ${mine?"mine":""}" data-m="${i}" data-t="${t.teamNumber}" aria-label="Scout team ${t.teamNumber} in ${matchLabel(m)}${done?" (scouted)":""}">${t.teamNumber}</button>`;
    };
    const time = m.scheduledStartTime ? new Date(m.scheduledStartTime).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) : "";
    const tagline = i===nextIdx ? '<small class="nx">Up next</small>' : `<small>${m.hasBeenPlayed ? "Played" : esc(time)}</small>`;
    return `<div class="match ${i===nextIdx?"next":""}" ${i===nextIdx?'id="nextMatch"':""}><div class="mnum">${matchLabel(m)}${tagline}</div><div class="alli">${red.map(chip).join("")}</div><div class="alli">${blue.map(chip).join("")}</div></div>`;
  };
  return `
  <div class="toolbar"><input id="filterIn" type="search" inputmode="numeric" placeholder="Filter by team #" value="${esc(S.filter)}" style="flex:1">
  ${S.myTeam ? `<button class="btn ghost" id="mineBtn" aria-pressed="${S.onlyMine}">${S.onlyMine ? "All matches" : "Only "+esc(S.myTeam)}</button>` : ""}
  <button class="btn ghost" id="refreshBtn" aria-label="Refresh schedule">↻</button></div>
  <div class="status" id="mstatus">${esc(S.matchStatus)}</div>
  ${list.length ? list.map(card).join("") : `<div class="empty">${S.matches.length ? "No matches for that filter." : "No schedule yet. Tap ↻ to check again."}</div>`}
  <p class="note">Tap a team number to scout that robot. ✓ means it's saved on this phone. To combine scouts' data, use Copy data and Import on the Teams tab.</p>`;
}

function scoreHead(c, sub){
  return `<div class="scorehead"><div class="tag ${c.alliance==="Red"?"r":"b"}">${c.team}</div><div><h2>${esc(c.match)} · ${c.alliance} alliance</h2><p class="sub">${sub}</p></div></div>`;
}
function fieldGrid(c){
  let tiles = "";
  for (let r=0;r<6;r++) for (let col=0;col<6;col++){
    const k = tileAt(r,col), on = c.tiles.includes(k);
    tiles += `<button class="tile" data-tile="${k}" aria-pressed="${on}" aria-label="Can shoot from ${k}"><span class="lbl">${k}</span></button>`;
  }
  return `<div class="fieldframe">
      <span></span><div class="side">Far wall</div><span></span>
      <div class="side v red">Red drivers</div>
      <div class="grid">${tiles}${FIELD_SVG}</div>
      <div class="side v right blue">Blue drivers</div>
      <span></span><div class="side">Audience</div><span></span>
    </div>`;
}
function viewLive(){
  const c = S.cur, T = tally(c), ph = c.phase;
  const rem = DUR[ph] ? Math.max(0, DUR[ph] - elapsed()) : DUR.auto;
  const eg = ph === "tele" && rem <= ENDGAME;
  const label = {pre:"Ready", auto:"Autonomous", trans:"Transition", tele: eg ? "Endgame" : "TeleOp"}[ph];
  const pct = DUR[ph] ? 100 * rem / DUR[ph] : 100;
  const sub = {
    pre: `Press <kbd>Enter</kbd> or GO the moment the field starts the match.`,
    auto: "Everything you log now counts as Auto.",
    trans: `Drivers picking up controllers. <button class="linkbtn" data-skip>Start TeleOp now</button> <kbd>Enter</kbd>`,
    tele: eg ? "Endgame. Last 30 seconds." : "Everything you log now counts as TeleOp."
  }[ph];
  const made = T.madeAuto + T.madeTele, shots = made + T.miss;
  const off = ph === "pre" ? 'aria-disabled="true"' : "";
  const pad = `<div class="shotpad">
    <button class="shot made" data-act="shot" ${off} aria-label="Made shot (Space)">
      <span class="shot-top"><span class="shot-name">Made shot</span><kbd>Space</kbd></span>
      <span class="shot-n">${made}</span>
      <span class="shot-sub">Auto ${T.madeAuto} · TeleOp ${T.madeTele}</span>
    </button>
    <button class="shot miss" data-act="miss" ${off} aria-label="Missed shot (X)">
      <span class="shot-top"><span class="shot-name">Miss</span><kbd>X</kbd></span>
      <span class="shot-n">${T.miss}</span>
      <span class="shot-sub">${shots ? Math.round(100*made/shots) + "% made" : "no shots yet"}</span>
    </button>
    <button class="shot hive" data-act="tip" ${off} aria-label="Hive tip (T)">
      <span class="shot-top"><span class="shot-name">Hive tip</span><kbd>T</kbd></span>
      <span class="hive-row"><span class="shot-n">${T.auto + T.tele}</span><span class="shot-sub">Auto ${T.auto} · TeleOp ${T.tele}</span></span>
    </button>
  </div>`;
  const actBtn = a => {
    const lab = a.k === "dc" && c.dcOn ? "Back online" : a.label;
    const hint = a.k === "dc" ? `<small>${c.dcOn ? "Robot is dead. Press again when it moves" : "Press again when it's back"}</small>` : "";
    return `<button class="act ${a.main?"main":""} ${a.k==="dc"&&c.dcOn?"on":""}" data-act="${a.k}" ${ph==="pre"?'aria-disabled="true"':""}><span>${lab}${hint}</span><kbd>${a.kbd}</kbd></button>`;
  };
  const log = c.events.slice(-6).reverse().map(e => `<li><span class="lt">${fmtClock(e.t, true)}</span><span class="lp ${e.ph}">${e.ph==="auto"?"AUTO":"TELE"}</span><span>${EV_LABEL[e.k]}${e.tile?` <span style="color:var(--muted)">from ${e.tile}</span>`:""}</span></li>`).join("");
  return `
  ${scoreHead(c, "Live scoring")}
  <div class="clock ph-${eg?"eg":ph}">
    <div class="clk-top"><span class="phase">${label}</span><span class="time" id="clockT">${fmtClock(rem)}</span></div>
    <div class="bar"><i id="clockBar" style="width:${pct.toFixed(1)}%"></i></div>
    <div class="clk-sub">${sub}</div>
  </div>
  ${pad}
  <div class="acts">${ACTS.filter(a => !a.pad).map(actBtn).join("")}</div>
  ${log ? `<div><div class="lab" style="margin-bottom:8px">What happened</div><ul class="log">${log}</ul></div>` : ""}
  <div class="keys"><span><kbd>Enter</kbd>GO</span><span><kbd>Space</kbd>made shot</span><span><kbd>X</kbd>miss</span><span><kbd>T</kbd>hive tip</span><span><kbd>J</kbd>jam</span><span><kbd>P</kbd>pushed</span><span><kbd>D</kbd>DC</span><span><kbd>Z</kbd>undo</span></div>`;
}
function viewSurvey(){
  const c = S.cur, T = tally(c), shots = T.madeAuto + T.madeTele + T.miss;
  const acc = shots ? Math.round(100 * (T.madeAuto + T.madeTele) / shots) + "%" : "–";
  const cnt = {jammed:T.jam, pushed:T.push, dc:T.dc};
  const q = x => `<div class="q"><div class="lab">${x.label}</div><div class="seg">${x.opts.map(([v,l]) => `<button data-q="${x.k}" data-v="${v}" aria-pressed="${String(c[x.k])===String(v)}">${l}</button>`).join("")}</div>${x.ends?`<div class="ends"><span>${x.ends[0]}</span><span>${x.ends[1]}</span></div>`:""}</div>`;
  const log = c.events.map((e,i) => `<li><span class="lt">${fmtClock(e.t, true)}</span><span class="lp ${e.ph}">${e.ph==="auto"?"AUTO":"TELE"}</span><span>${EV_LABEL[e.k]}${e.tile?` <span style="color:var(--muted)">from ${e.tile}</span>`:""}</span><button class="x" data-del="${i}" aria-label="Remove this event">✕</button></li>`).join("");
  return `
  ${scoreHead(c, c.edited ? "Editing a saved entry" : "After-match survey")}
  <div class="sumcard" style="grid-template-columns:1fr">
    <div class="stats" style="justify-content:space-between"><div class="stat"><b>${T.madeAuto + T.madeTele}</b><span>made shots</span></div><div class="stat"><b>${T.miss}</b><span>missed</span></div><div class="stat"><b>${T.auto}</b><span>auto tips</span></div><div class="stat"><b>${T.tele}</b><span>teleop tips</span></div><div class="stat"><b>${acc}</b><span>accuracy</span></div></div>
  </div>
  <div class="fieldwrap">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><div class="lab">Where can they shoot from? Tap every tile</div><button class="linkbtn" id="clearTiles">Clear</button></div>
    ${fieldGrid(c)}
    <div class="legend"><span><i style="background:var(--honey);border-radius:50%"></i>Flower</span><span><i style="background:var(--red-soft);border:1.5px solid var(--red)"></i>Hive cells</span><span><i style="border:1.5px solid var(--red);background:transparent"></i>Loading zone</span><span><i style="background:var(--red);height:4px"></i>Garden</span></div>
  </div>
  <div><div class="lab" style="margin-bottom:8px">Problems this match</div>
  <div class="checks">${CHECKS.map(x => `<button class="check" data-check="${x.k}" aria-pressed="${!!c[x.k]}"><span class="box">✓</span><span>${x.label}<small>${cnt[x.k] ? `Logged ${cnt[x.k]}× during the match` : x.hint}</small></span></button>`).join("")}</div></div>
  ${QS.map(q).join("")}
  <div class="q"><div class="lab">Notes</div><textarea class="notes" id="notesIn" placeholder="Anything the numbers miss: strategy, auto path, what broke…">${esc(c.notes)}</textarea></div>
  ${c.events.length ? `<details class="mlog"><summary>Match log (${c.events.length} events). Remove any mistakes</summary><ul class="log">${log}</ul></details>` : ""}`;
}

function viewTeams(){
  const by = {};
  for (const e of Object.values(S.entries)){
    if (!e || e.event !== S.event.code) continue;
    (by[e.team] ||= []).push(e);
  }
  const teams = Object.entries(by).map(([team, es]) => {
    const n = es.length, sum = k => es.reduce((s,e)=>s+(e[k]||0),0);
    const heat = {}; es.forEach(e => (e.tiles||[]).forEach(t => heat[t]=(heat[t]||0)+1));
    const cnt = k => es.filter(e => e[k]).length;
    const made = sum("autoMade") + sum("teleMade"), shots = made + sum("misses");
    const rated = es.filter(e => e.driving > 0);
    const picks = {yes:0, maybe:0, no:0}; es.forEach(e => { if (picks[e.pick] != null) picks[e.pick]++; });
    const note = es.filter(e => e.notes).sort((a,b) => (b.savedAt||"").localeCompare(a.savedAt||""))[0]?.notes || "";
    return {team, n, auto:sum("autoTips")/n, tele:sum("teleTips")/n, heat, jammed:cnt("jammed"), pushed:cnt("pushed"), dc:cnt("dc"),
      made: made/n, acc: shots ? Math.round(100*made/shots) + "%" : "–", drive: rated.length ? (rated.reduce((s,e)=>s+e.driving,0)/rated.length).toFixed(1) : "–", picks, note};
  }).sort((a,b) => (b.auto+b.tele)-(a.auto+a.tele));
  const n = Object.values(S.entries).filter(e => e.event === S.event.code).length;
  const tools = `<div class="toolbar"><span class="status" style="flex:1">${teams.length} teams · ${n} entries on this phone</span><button class="btn ghost" id="copyCsv">Copy data</button><button class="btn ghost" id="importToggle">Import</button></div>
  <textarea id="csvOut" hidden readonly style="width:100%;height:140px;font-family:var(--f-mono);font-size:12px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px"></textarea>
  <div ${S.importOpen ? "" : "hidden"} style="display:flex;flex-direction:column;gap:8px">
    <p class="sub">Paste data another scout copied with Copy data. Matching entries keep whichever was saved most recently.</p>
    <textarea id="importIn" placeholder="event,level,match_id,match,team,..." style="width:100%;height:140px;font-family:var(--f-mono);font-size:12px;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:10px;padding:8px"></textarea>
    <button class="btn" id="importGo">Merge into this phone</button>
    ${S.importMsg ? `<p class="sub">${esc(S.importMsg)}</p>` : ""}
  </div>`;
  if (!teams.length) return tools + `<div class="empty"><h2>No scouting data yet</h2><p>Scouted matches show up here, ranked by average hive tips, with a heat map of where each team shoots from.</p></div>`;
  const card = t => {
    const max = Math.max(1, ...Object.values(t.heat));
    let cells = ""; for (let r=0;r<6;r++) for (let c=0;c<6;c++){ const k = tileAt(r,c), v = t.heat[k]||0; cells += `<i title="${k}: ${v}">${v?`<b style="opacity:${(.25+.75*v/max).toFixed(2)}"></b>`:""}</i>`; }
    return `<div class="team"><div><div class="num">${esc(t.team)}</div>
      <div class="stats"><div class="stat"><b>${t.auto.toFixed(1)}</b><span>auto tips</span></div><div class="stat"><b>${t.tele.toFixed(1)}</b><span>teleop tips</span></div><div class="stat"><b>${t.made.toFixed(1)}</b><span>made shots</span></div><div class="stat"><b>${t.acc}</b><span>accuracy</span></div><div class="stat"><b>${t.drive}</b><span>driver /5</span></div></div>
      <div class="flags"><span class="flag">${t.n} match${t.n>1?"es":""}</span><span class="flag ${t.jammed?"bad":""}">Jammed ${t.jammed}/${t.n}</span><span class="flag ${t.pushed?"bad":""}">Pushed ${t.pushed}/${t.n}</span><span class="flag ${t.dc?"bad":""}">DC ${t.dc}/${t.n}</span>${t.picks.yes+t.picks.maybe+t.picks.no ? `<span class="flag" style="background:var(--honey-soft);color:var(--fg)">Pick: ${t.picks.yes} yes · ${t.picks.maybe} maybe · ${t.picks.no} no</span>` : ""}</div>
      ${t.note ? `<div class="tnote">“${esc(t.note)}”</div>` : ""}</div>
      <div class="mini" aria-label="Shooting tiles heat map">${cells}</div></div>`;
  };
  return tools + `<div class="status">Ranked by average hive tips per match</div>` + teams.map(card).join("");
}

/* ---------- events ---------- */
app.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "teamForm"){ const v = document.getElementById("teamIn").value.trim(); if (!v) return; S.myTeam = v; ls.set("hs.myTeam", v); findEventsForTeam(v); }
  if (e.target.id === "searchForm"){ const v = document.getElementById("searchIn").value.trim(); S.searchQ = v; if (v) searchEvents(v); }
});
app.addEventListener("input", e => {
  if (e.target.id === "notesIn"){ S.cur.notes = e.target.value; return; }
  if (e.target.id === "filterIn"){ S.filter = e.target.value; const pos = e.target.selectionStart; render(); const el = document.getElementById("filterIn"); el.focus(); try{ el.setSelectionRange(pos,pos);}catch(_){} }
});
app.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.pick){ const ev = window._evcache.find(x => x.code === b.dataset.pick); if (ev) pickEvent(ev); return; }
  if (b.dataset.tab){ S.tab = b.dataset.tab; render(); return; }
  if (b.id === "refreshBtn"){ loadMatches(); return; }
  if (b.id === "mineBtn"){ S.onlyMine = !S.onlyMine; ls.set("hs.onlyMine", S.onlyMine); render(); return; }
  if (b.id === "demoBtn"){ startDemo(); return; }
  if (b.dataset.m != null){ const mi = +b.dataset.m, m = S.matches[mi]; const t = m.teams.find(x => String(x.teamNumber) === b.dataset.t); openScore(m, t, mi); return; }
  if (b.dataset.act){ act(b.dataset.act); return; }
  if (b.dataset.tile){ const k = b.dataset.tile, i = S.cur.tiles.indexOf(k); if (i < 0) S.cur.tiles.push(k); else S.cur.tiles.splice(i,1); b.setAttribute("aria-pressed", i < 0); return; }
  if (b.id === "clearTiles"){ S.cur.tiles = []; document.querySelectorAll(".tile").forEach(t => t.setAttribute("aria-pressed","false")); return; }
  if (b.dataset.skip != null){ if (S.cur.phase === "trans") setPhase("tele"); return; }
  if (b.dataset.q){ const k = b.dataset.q, v = k === "driving" ? +b.dataset.v : b.dataset.v; S.cur[k] = String(S.cur[k]) === String(v) ? (k==="driving"?0:"") : v;
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(S.cur[k]) === x.dataset.v)); return; }
  if (b.dataset.del != null){ S.cur.events.splice(+b.dataset.del, 1); render(); document.querySelector("details.mlog")?.setAttribute("open",""); return; }
  if (b.dataset.check){ const k = b.dataset.check; S.cur[k] = !S.cur[k]; b.setAttribute("aria-pressed", S.cur[k]); return; }
  if (b.id === "copyCsv"){
    const csv = toCSV(Object.values(S.entries).filter(x=>x.event===S.event.code));
    try{ await navigator.clipboard.writeText(csv); toast("Copied. Send it to your lead scout."); }
    catch(_){ const ta = document.getElementById("csvOut"); ta.hidden = false; ta.value = csv; ta.select(); toast("Select all and copy"); }
    return;
  }
  if (b.id === "importToggle"){ S.importOpen = !S.importOpen; S.importMsg = ""; render(); return; }
  if (b.id === "importGo"){
    const r = importCSV(document.getElementById("importIn").value);
    S.importMsg = r.error || `Added ${r.added} new entries, updated ${r.updated}.`;
    render(); return;
  }
});
document.getElementById("savebar").addEventListener("click", e => {
  const b = e.target.closest("button[data-bar]"); if (!b || !S.cur) return;
  const a = b.dataset.bar;
  if (a === "back") leaveScore();
  else if (a === "go") startMatch();
  else if (a === "end") endMatch();
  else if (a === "quit"){ if (armed("quit", "Press Quit again to throw this match away")) leaveScore(); }
  else if (a === "discard"){ if (armed("discard", "Press Discard again to throw this match away")) leaveScore(); }
  else if (a === "save") saveCur();
});
// Keybinds for live scoring. Ignored while typing in a text box.
document.addEventListener("keydown", e => {
  const c = S.cur;
  if (S.view !== "score" || !c || c.stage !== "live") return;
  if (e.target.closest?.("input,textarea,select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === "Enter"){ e.preventDefault(); if (c.phase === "pre") startMatch(); else if (c.phase === "trans") setPhase("tele"); return; }
  if (k === "Backspace"){ e.preventDefault(); if (!e.repeat) act("undo"); return; }
  const a = ACTS.find(x => x.key === k.toLowerCase());
  if (a){ e.preventDefault(); if (!e.repeat) act(a.k); }
});
document.getElementById("changeEvt").onclick = () => { S.view = "event"; S.eventResults = null; S.eventMsg = ""; render(); loadTodaysEvents(); if (S.myTeam) findEventsForTeam(S.myTeam); };
function scrollToNext(){ requestAnimationFrame(() => document.getElementById("nextMatch")?.scrollIntoView({block:"center"})); }

/* ---------- boot ---------- */
// ?demo jumps straight into a demo match, ready for GO
if (new URLSearchParams(location.search).has("demo")){
  startDemo(); const m = S.matches[0]; openScore(m, m.teams[0], 0);
}
else if (S.event){ S.view = "matches"; S.matches = ls.get("hs.matches."+S.event.code, []); subscribeEntries(); loadMatches().then(scrollToNext); }
else { loadTodaysEvents(); if (S.myTeam) findEventsForTeam(S.myTeam); }
render();
</script>
</body>
</html>
